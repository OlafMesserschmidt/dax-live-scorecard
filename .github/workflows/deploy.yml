# =============================================================================
#  DAX Live Scorecard — Auto-Deploy via GitHub Actions
#
#  Bei Push auf main → SSH zum VPS → git pull → pm2 restart
#
#  Benötigte GitHub Secrets (Settings → Secrets and variables → Actions):
#    VPS_HOST       — IP-Adresse des Hostinger VPS
#    VPS_USER       — SSH-User (root)
#    VPS_SSH_KEY    — Private SSH-Key (Ed25519/RSA, inkl. BEGIN/END-Zeilen)
#    VPS_PORT       — SSH-Port (z.B. 22)
# =============================================================================
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # ─── SSH-Agent einrichten ───────────────────────────────────────────
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      # ─── Known Hosts hinzufügen ─────────────────────────────────────────
      - name: Add VPS to known hosts
        run: |
          PORT="${{ secrets.VPS_PORT || 22 }}"
          echo "Scanning host ${{ secrets.VPS_HOST }}:$PORT ..."
          ssh-keyscan -p "$PORT" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          echo "Done. Known hosts:"
          wc -l ~/.ssh/known_hosts

      # ─── Debug: SSH-Verbindung testen ──────────────────────────────────
      - name: Test SSH connection
        run: |
          PORT="${{ secrets.VPS_PORT || 22 }}"
          echo "Connecting to ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:$PORT ..."
          ssh -p "$PORT" -v -o ConnectTimeout=10 -o BatchMode=yes \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "echo 'SSH_OK: $(hostname) $(whoami) $(date)'"

      # ─── Deploy-Script ausführen ───────────────────────────────────────
      - name: Deploy to VPS
        run: |
          PORT="${{ secrets.VPS_PORT || 22 }}"
          ssh -p "$PORT" -o ConnectTimeout=10 -o BatchMode=yes \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'DEPLOY_SCRIPT'
            set -euo pipefail

            # NVM laden (non-interactive SSH lädt .bashrc nicht)
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            echo "Node: $(node -v 2>/dev/null || echo 'NOT FOUND')"
            echo "PM2:  $(pm2 --version 2>/dev/null || echo 'NOT FOUND')"

            APP_DIR="/var/www/dax-scorecard"
            cd "$APP_DIR"

            echo ":: Git pull"
            git fetch origin main
            git reset --hard origin/main
            echo "HEAD: $(git rev-parse --short HEAD)"

            echo ":: PM2 restart"
            pm2 restart dax-scorecard --update-env
            pm2 list

            echo ":: Health-Check"
            sleep 3
            if curl -sf http://127.0.0.1:4173/api/health | grep -q '"ok":true'; then
              echo "DEPLOY_OK: App healthy"
            else
              echo "DEPLOY_FAIL: Health-Check failed"
              pm2 logs dax-scorecard --lines 20 --nostream
              exit 1
            fi
          DEPLOY_SCRIPT
