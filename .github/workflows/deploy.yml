# =============================================================================
#  DAX Live Scorecard — Auto-Deploy via GitHub Actions
#
#  Bei Push auf main → SSH zum VPS → git pull → pm2 restart
#
#  Benötigte GitHub Secrets (Settings → Secrets and variables → Actions):
#    VPS_HOST       — IP-Adresse des Hostinger VPS
#    VPS_USER       — SSH-User (root)
#    VPS_SSH_KEY    — Private SSH-Key (Ed25519/RSA, inkl. BEGIN/END-Zeilen)
#    VPS_PORT       — SSH-Port (z.B. 22)
# =============================================================================
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # ─── SSH-Key als Datei schreiben + ssh-agent starten ────────────────
      - name: Configure SSH
        run: |
          set -euo pipefail

          # SSH-Verzeichnis anlegen
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Private Key aus Secret in Datei schreiben
          # GitHub Secrets können \n als Literal enthalten — wir behandeln beides
          printf '%s' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key

          # Falls die Datei keine echten Newlines enthält (literal \n),
          # mit sed reparieren
          if ! grep -q 'BEGIN' ~/.ssh/vps_key; then
            sed -i 's/\\n/\n/g' ~/.ssh/vps_key
          fi

          chmod 600 ~/.ssh/vps_key

          # Validierung
          echo "Key file size: $(wc -c < ~/.ssh/vps_key) bytes"
          echo "Key first line: $(head -1 ~/.ssh/vps_key)"
          echo "Key last line:  $(tail -1 ~/.ssh/vps_key)"

          # ssh-agent starten und Key hinzufügen
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/vps_key

          # Known hosts
          PORT="${{ secrets.VPS_PORT || 22 }}"
          echo "Scanning ${{ secrets.VPS_HOST }}:$PORT ..."
          ssh-keyscan -p "$PORT" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts
          echo "Known hosts entries: $(wc -l < ~/.ssh/known_hosts)"

      # ─── Debug: SSH-Verbindung testen ──────────────────────────────────
      - name: Test SSH connection
        run: |
          PORT="${{ secrets.VPS_PORT || 22 }}"
          echo "Connecting to ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:$PORT ..."
          ssh -p "$PORT" -o ConnectTimeout=10 -o BatchMode=yes \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "echo 'SSH_OK: $(hostname) $(whoami) $(date)'"

      # ─── Deploy-Script ausführen ───────────────────────────────────────
      - name: Deploy to VPS
        run: |
          PORT="${{ secrets.VPS_PORT || 22 }}"

          # Heredoc als separate Datei, um Quoting-Probleme zu vermeiden
          cat > /tmp/deploy.sh << 'DEPLOY_SCRIPT'
          set -euo pipefail

          # NVM laden (non-interactive SSH lädt .bashrc nicht)
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

          echo "Node: $(node -v 2>/dev/null || echo 'NOT FOUND')"
          echo "PM2:  $(pm2 --version 2>/dev/null || echo 'NOT FOUND')"

          APP_DIR="/var/www/dax-scorecard"
          cd "$APP_DIR"

          echo ":: Git pull"
          git fetch origin main
          git reset --hard origin/main
          echo "HEAD: $(git rev-parse --short HEAD)"

          echo ":: PM2 restart"
          pm2 restart dax-scorecard --update-env
          pm2 list

          echo ":: Health-Check"
          sleep 3
          if curl -sf http://127.0.0.1:4173/api/health | grep -q '"ok":true'; then
            echo "DEPLOY_OK: App healthy"
          else
            echo "DEPLOY_FAIL: Health-Check failed"
            pm2 logs dax-scorecard --lines 20 --nostream
            exit 1
          fi
          DEPLOY_SCRIPT

          ssh -p "$PORT" -o ConnectTimeout=10 -o BatchMode=yes \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            < /tmp/deploy.sh
