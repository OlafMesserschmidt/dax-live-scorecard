# =============================================================================
#  DAX Live Scorecard — Auto-Deploy via GitHub Actions
#
#  Bei Push auf main → SSH zum VPS → git pull → pm2 restart
#
#  Benötigte GitHub Secrets (Settings → Secrets and variables → Actions):
#    VPS_HOST       — IP-Adresse des Hostinger VPS
#    VPS_USER       — SSH-User (root)
#    VPS_SSH_KEY    — Private SSH-Key (Ed25519/RSA, inkl. BEGIN/END-Zeilen)
#    VPS_PORT       — SSH-Port (z.B. 22 als String)
# =============================================================================
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # ─── Diagnose-Step: Secrets validieren (ohne Werte zu leaken) ───────
      - name: Validate secrets
        run: |
          echo "VPS_HOST set:     ${{ secrets.VPS_HOST != '' && 'yes' || 'NO' }}"
          echo "VPS_USER set:     ${{ secrets.VPS_USER != '' && 'yes' || 'NO' }}"
          echo "VPS_SSH_KEY set:  ${{ secrets.VPS_SSH_KEY != '' && 'yes' || 'NO' }}"
          echo "VPS_PORT set:     ${{ secrets.VPS_PORT != '' && 'yes' || 'NO (defaults to 22)' }}"
          KEY_LEN=$(printf '%s' "${{ secrets.VPS_SSH_KEY }}" | wc -c)
          echo "VPS_SSH_KEY len:  $KEY_LEN bytes"
          KEY_FIRST=$(printf '%s' "${{ secrets.VPS_SSH_KEY }}" | head -1)
          echo "VPS_SSH_KEY starts with: $KEY_FIRST"

      # ─── Diagnose-Step: Netzwerk-Test zum VPS ───────────────────────────
      - name: Network reachability test
        run: |
          echo "Testing TCP connectivity to ${{ secrets.VPS_HOST }}:${{ secrets.VPS_PORT || 22 }} ..."
          nc -zv -w5 "${{ secrets.VPS_HOST }}" "${{ secrets.VPS_PORT || 22 }}" 2>&1 || true

      # ─── Deploy-Step: SSH + Script ──────────────────────────────────────
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 30s
          command_timeout: 60s
          script: |
            set -euo pipefail

            # NVM laden (non-interactive SSH lädt .bashrc nicht)
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            echo "Node: $(node -v 2>/dev/null || echo 'NOT FOUND')"
            echo "PM2:  $(pm2 --version 2>/dev/null || echo 'NOT FOUND')"

            APP_DIR="/var/www/dax-scorecard"
            cd "$APP_DIR"

            echo ":: Git pull"
            git fetch origin main
            git reset --hard origin/main
            echo "HEAD: $(git rev-parse --short HEAD)"

            echo ":: PM2 restart"
            pm2 restart dax-scorecard --update-env
            pm2 list

            echo ":: Health-Check"
            sleep 3
            if curl -sf http://127.0.0.1:4173/api/health | grep -q '"ok":true'; then
              echo "DEPLOY_OK: App healthy"
            else
              echo "DEPLOY_FAIL: Health-Check failed"
              pm2 logs dax-scorecard --lines 20 --nostream
              exit 1
            fi
