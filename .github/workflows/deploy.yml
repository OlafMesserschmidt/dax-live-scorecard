# =============================================================================
#  DAX Live Scorecard — Auto-Deploy via GitHub Actions
#
#  Bei Push auf main → SSH zum VPS → git pull → pm2 restart
#
#  Benötigte GitHub Secrets (Settings → Secrets and variables → Actions):
#    VPS_HOST       — IP-Adresse des Hostinger VPS
#    VPS_USER       — SSH-User (root)
#    VPS_SSH_KEY    — Private SSH-Key (Ed25519/RSA, inkl. BEGIN/END-Zeilen)
#    VPS_PORT       — SSH-Port (z.B. 22)
# =============================================================================
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
    steps:
      # ─── SSH-Key als Datei schreiben ────────────────────────────────────
      - name: Configure SSH
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Key über env var (sicher vor YAML-Interpolation-Issues)
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key

          # Falls literal \n statt echter Newline:
          if ! grep -q 'BEGIN' ~/.ssh/vps_key; then
            sed -i 's/\\n/\n/g' ~/.ssh/vps_key
          fi

          chmod 600 ~/.ssh/vps_key

          echo "Key file size: $(wc -c < ~/.ssh/vps_key) bytes"
          echo "Key first line: $(head -1 ~/.ssh/vps_key)"
          echo "Key last line:  $(tail -1 ~/.ssh/vps_key)"

          # ssh-agent starten und Key laden
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/vps_key 2>&1 || true

          # Known hosts
          echo "Scanning $VPS_HOST:$VPS_PORT ..."
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts
          echo "Known hosts: $(wc -l < ~/.ssh/known_hosts) entries"

      # ─── SSH-Verbindung testen ─────────────────────────────────────────
      - name: Test SSH connection
        run: |
          set -euo pipefail
          echo "Connecting to $VPS_USER@$VPS_HOST:$VPS_PORT ..."
          ssh -p "$VPS_PORT" -o ConnectTimeout=10 -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" \
            "echo SSH_OK: \$(hostname) \$(whoami)"

      # ─── Deploy-Script ausführen ───────────────────────────────────────
      - name: Deploy to VPS
        run: |
          set -euo pipefail

          # Deploy-Script lokal vorbereiten
          cat > /tmp/deploy.sh << 'DEPLOY_SCRIPT'
          set -euo pipefail

          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

          echo "Node: $(node -v 2>/dev/null || echo NOT_FOUND)"
          echo "PM2:  $(pm2 --version 2>/dev/null || echo NOT_FOUND)"

          cd /var/www/dax-scorecard

          echo ":: Git pull"
          git fetch origin main
          git reset --hard origin/main
          echo "HEAD: $(git rev-parse --short HEAD)"

          echo ":: PM2 restart"
          pm2 restart dax-scorecard --update-env
          pm2 list

          echo ":: Health-Check"
          sleep 3
          if curl -sf http://127.0.0.1:4173/api/health | grep -q '"ok":true'; then
            echo "DEPLOY_OK: App healthy"
          else
            echo "DEPLOY_FAIL: Health-Check failed"
            pm2 logs dax-scorecard --lines 20 --nostream
            exit 1
          fi
          DEPLOY_SCRIPT

          ssh -p "$VPS_PORT" -o ConnectTimeout=10 -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" \
            < /tmp/deploy.sh
