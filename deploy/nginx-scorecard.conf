# /etc/nginx/sites-available/dax-scorecard.conf
# Reverse Proxy für DAX Live Scorecard Dashboard

upstream dax_scorecard {
    server 127.0.0.1:4173;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name scorecard.example.com;

    # HTTP → HTTPS redirect
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name scorecard.example.com;

    # SSL-Zertifikate (Let's Encrypt via Certbot)
    ssl_certificate     /etc/letsencrypt/live/scorecard.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scorecard.example.com/privkey.pem;

    # SSL-Konfiguration (Mozilla Intermediate, TLS 1.2+)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API-Proxy
    location /api/ {
        proxy_pass http://dax_scorecard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 15s;
    }

    # Statische Files (über Node-Server, könnten auch direkt via Nginx)
    location / {
        proxy_pass http://dax_scorecard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health-Check (ohne Logging)
    location = /api/health {
        proxy_pass http://dax_scorecard;
        access_log off;
    }

    # Gzip für API-JSON
    gzip on;
    gzip_types application/json text/css text/javascript;
    gzip_min_length 256;
}
